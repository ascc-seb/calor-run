<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participants Calor Run</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃‍♀️</text></svg>">
  <link rel="stylesheet" href="common.css">
  <style>
    :root {
      --bg-overlay: rgba(33, 94, 153, 0.3);
      --hover-blue: #e9f7ff;
      --transition-smooth: 0.3s ease;
    }
    #counter {
      flex-shrink:0;
      white-space:nowrap;
      font-size:1rem;
      color:#000;
      font-weight:normal;
    }
    .sort-indicator {
      position:absolute; top:50%; transform:translateY(-50%);
      border-left:5px solid transparent; border-right:5px solid transparent;
      border-bottom:6px solid rgba(0,0,0,0.4); opacity:0.5;
      transition: all var(--transition-smooth); pointer-events:none;
    }
    th.sorted .sort-indicator { opacity:1; border-bottom-color: var(--primary-color); }
    th.sorted.desc .sort-indicator { transform:translateY(-50%) rotate(180deg); }
    .header-label { display:inline-block; vertical-align:middle; margin-right:4px; }
    .no-results { text-align:center; padding:40px; color:#666; font-style:italic; }
    @media(max-width:768px){
      .search-counter-container { display:block !important; margin-bottom:0.625rem; }
      #search, #counter { display:block !important; font-size:0.75rem; text-align:center; width:100% !important; padding:0; max-width:none; margin:0 0 0.625rem; white-space:normal; }
      #counter { margin-bottom:0; }
    }
  </style>
</head>
<body>
  <div class="container">
<div class="header">
<div class="svg-wrapper">
<span class="header-title">PARTICIPANTS</span>
<div id="animSvgContainer"></div>
</div>
</div>
    <div class="search-counter-container">
      <input type="text" id="search" placeholder="Rechercher par nom, prénom, club ou catégorie (ex: HM0, FSE)" autocomplete="off">
      <div id="counter">
        <span class="counter-10km">10 km : 0</span><span> • </span>
        <span class="counter-20km">20 km : 0</span><span> • </span>
        <span class="counter-total">Total : 0</span>
      </div>
    </div>
    <div class="table-container">
      <table id="data-table">
        <thead>
          <tr>
            <th data-column="dossard" class="text-center" scope="col" aria-sort="none"><span class="header-label">Dossard</span><span class="sort-indicator"></span></th>
            <th data-column="nom" scope="col" aria-sort="none"><span class="header-label">Nom</span><span class="sort-indicator"></span></th>
            <th data-column="prenom" scope="col" aria-sort="none"><span class="header-label">Prénom</span><span class="sort-indicator"></span></th>
            <th data-column="club" scope="col" aria-sort="none"><span class="header-label">Club</span><span class="sort-indicator"></span></th>
            <th data-column="genre" class="text-center" scope="col" aria-sort="none"><span class="header-label">Genre</span><span class="sort-indicator"></span></th>
            <th data-column="categorie" class="text-center" scope="col" aria-sort="none"><span class="header-label">Catégorie</span><span class="sort-indicator"></span></th>
            <th data-column="course" class="text-center" scope="col" aria-sort="none"><span class="header-label">Course</span><span class="sort-indicator"></span></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" class="loading">Chargement des données...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="svg-logo.js"></script>
<script src="svg-animation.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="firebase-common.js"></script>
<script>
'use strict';

const db = firebase.database();
const dbRef = db.ref("participants");

const AppState = {
  allData: [], filteredData: [],
  currentSort: { column: 'dossard', direction: 'asc' },
  isLoading: true
};

const elements = {
  tbody: document.getElementById("table-body"),
  searchInput: document.getElementById("search"),
  counter: document.getElementById("counter"),
  headers: document.querySelectorAll("th[data-column]")
};

const utils = {
  debounce(func, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func(...args), wait);
    };
  },
  normalizeString(str) {
    return str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  }
};

function renderTable() {
  if (AppState.isLoading) return;
  if (AppState.filteredData.length === 0) {
    elements.tbody.innerHTML = `
      <tr><td colspan="7" class="no-results">
        ${AppState.allData.length === 0 ? 'Aucune donnée disponible' : 'Aucun résultat trouvé'}
      </td></tr>`;
    updateCounter(); return;
  }
  const fragment = document.createDocumentFragment();
  AppState.filteredData.forEach(p => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="text-center">${escapeHtml(p.dossard)}</td>
      <td>${escapeHtml(p.nom)}</td>
      <td>${escapeHtml(p.prenom)}</td>
      <td>${escapeHtml(p.club) || '-'}</td>
      <td class="text-center">${escapeHtml(p.genre)}</td>
      <td class="text-center">${escapeHtml(p.categorie)}</td>
      <td class="text-center">${!isNaN(p.course) && p.course !== '' ? `${escapeHtml(p.course)} km` : escapeHtml(p.course)}</td>`;
    fragment.appendChild(row);
  });
  elements.tbody.innerHTML = '';
  elements.tbody.appendChild(fragment);
  updateCounter();
}

function updateCounter() {
  const km10 = AppState.filteredData.filter(p => p.course == "10").length;
  const km20 = AppState.filteredData.filter(p => p.course == "20").length;
  const total = AppState.filteredData.length;
  elements.counter.innerHTML = `
    <span class="counter-10km">10 km : ${km10}</span><span> • </span>
    <span class="counter-20km">20 km : ${km20}</span><span> • </span>
    <span class="counter-total">Total : ${total}</span>`;
}

function updateSortIndicators() {
  elements.headers.forEach(h => {
    h.classList.remove('sorted','asc','desc');
    h.setAttribute('aria-sort','none');
    if (h.dataset.column === AppState.currentSort.column) {
      h.classList.add('sorted', AppState.currentSort.direction);
      h.setAttribute('aria-sort', AppState.currentSort.direction === 'asc' ? 'ascending':'descending');
    }
  });
}

function sortData(column, direction=null) {
  if (!direction) {
    direction = AppState.currentSort.column === column && AppState.currentSort.direction === 'asc' ? 'desc':'asc';
  }
  AppState.currentSort = { column, direction };
  AppState.filteredData.sort((a,b) => {
    let A = a[column], B = b[column];
    if (!isNaN(A) && !isNaN(B)) { A=Number(A); B=Number(B); }
    else { A=utils.normalizeString(A); B=utils.normalizeString(B); }
    if (A<B) return direction==='asc'?-1:1;
    if (A>B) return direction==='asc'?1:-1;
    return 0;
  });
  updateSortIndicators(); renderTable();
}

function filterData(searchTerm) {
  const raw = searchTerm || "";
  const norm = utils.normalizeString(raw);
  
  if (!norm) {
    AppState.filteredData = [...AppState.allData];
    sortData(AppState.currentSort.column, AppState.currentSort.direction);
    return;
  }
  
  // --- Extraire genre+cat (ex: "hm0", "fse") ---
  const gcMatch = norm.match(/\b([hf])([a-z0-9]+)\b/);
  const genreFilter = gcMatch ? gcMatch[1].toUpperCase() : null;
  const catFilter = gcMatch ? gcMatch[2].toUpperCase() : null;
  
  // --- Extraire course ONLY si "km" présent (ex: "10 km" ou "10km") ---
  const courseMatch = norm.match(/\b(\d+)\s*km\b/);
  const courseFilter = courseMatch ? courseMatch[1] : null;
  
  // --- Supprimer les parties reconnues pour ne garder que les mots libres ---
  let remaining = norm;
  if (courseMatch) remaining = remaining.replace(/\b(\d+)\s*km\b/, " ");
  if (gcMatch) remaining = remaining.replace(/\b([hf])([a-z0-9]+)\b/, " ");
  
  // --- Mots libres (on ignore les tokens purement numériques pour éviter "10" tout seul) ---
  const textTerms = remaining
    .split(/\s+/)
    .map(t => t.trim())
    .filter(Boolean);
    
  AppState.filteredData = AppState.allData.filter(p => {
    // genre/catégorie
    if (genreFilter) {
      if ((p.genre || "").toUpperCase() !== genreFilter) return false;
      if (catFilter && (p.categorie || "").toUpperCase() !== catFilter) return false;
    }
    
    // course (strict : doit être "10 km" avec "km")
    if (courseFilter) {
      if (String(p.course) !== courseFilter) return false;
    }
    
    // mots libres : chaque mot doit être trouvé dans au moins un champ
    for (const term of textTerms) {
      const found = Object.entries(p).some(([k, v]) => {
        if (v === null || v === undefined) return false;
        if (k === "course") {
          const courseWithKm = `${v} km`;
          return utils.normalizeString(courseWithKm).includes(term) ||
                 utils.normalizeString(String(v)).includes(term);
        }
        return utils.normalizeString(String(v)).includes(term);
      });
      if (!found) return false;
    }
    
    return true;
  });
  
  sortData(AppState.currentSort.column, AppState.currentSort.direction);
}

const debouncedFilter = utils.debounce(searchTerm => filterData(searchTerm), 300);
elements.searchInput.addEventListener("input", e => debouncedFilter(e.target.value));
elements.headers.forEach(h => h.addEventListener("click", () => sortData(h.dataset.column)));

function initializeData() {
  safeListener(dbRef, snapshot => {
    const data = snapshot.val();
    if (data) {
      AppState.allData = Object.entries(data).map(([dossard, p]) => ({
        dossard,
        nom: p.nom || '',
        prenom: p.prenom || '',
        club: p.club || '',
        genre: p.genre || '',
        categorie: p.categorie || '',
        course: p.course || ''
      }));
      AppState.filteredData=[...AppState.allData]; AppState.isLoading=false;
      sortData('dossard','asc');
    } else {
      AppState.allData=[]; AppState.filteredData=[]; AppState.isLoading=false; renderTable();
    }
  }, err => {
    console.error("Erreur lors du chargement:", err);
    AppState.isLoading=false;
    elements.tbody.innerHTML=`<tr><td colspan="7" class="no-results">Erreur lors du chargement des données</td></tr>`;
  });
  window.addEventListener('beforeunload', () => dbRef.off('value'));
}

initializeData();
  </script>
</body>
</html>
