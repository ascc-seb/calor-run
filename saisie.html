<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Saisie Rapide</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

#num{
    width:90%;
    max-width:500px;
    font-size:48px;
    text-align:center;
    padding:20px;
}

#status{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    text-align:center;
    color:green;
    font-size:20px;
}
</style>
</head>
<body>

<input
    id="num"
    type="number"
    inputmode="numeric"
    autocomplete="off"
    autofocus
    placeholder="N°">

<div id="status"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
    getDatabase,
    ref,
    set
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
  authDomain: "calor-run.firebaseapp.com",
  databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calor-run",
  storageBucket: "calor-run.firebasestorage.app",
  messagingSenderId: "329949291334",
  appId: "1:329949291334:web:c71ef20268c609cf953b47",
  measurementId: "G-YVQPW6JGPK"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const input = document.getElementById("num");
const status = document.getElementById("status");

async function envoyer() {

    const valeur = input.value.trim();

    if (!valeur) return;

    const timestamp = Date.now();

    try {

        await set(
            ref(db, "saisie/" + valeur),
            timestamp
        );

        status.textContent = "✔ Envoyé";
        input.value = "";
        input.focus();

        setTimeout(() => {
            status.textContent = "";
        }, 500);

    } catch(e) {
        status.textContent = "❌ Erreur";
        console.error(e);
    }
}

input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        envoyer();
    }
});

window.addEventListener("load", () => {
    input.focus();
});

document.addEventListener("click", () => {
    input.focus();
});

</script>

</body>
</html>
