<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calor Run</title>
<link rel="icon" type="image/png" href="images/ico.png?v=1">
<link rel="stylesheet" href="common.css">
<style>
.button-row {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.button-row .button {
  width: 17ch;
  padding: 0.75rem 1rem;
  border-radius: var(--border-radius);
  background: var(--primary-color);
  color: #fff;
  font-size: 1rem;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.15);
  transition: background 0.3s;
}
.button-row .button:hover {
  background: var(--secondary-color);
}
.separator {
  border: none;
  border-top: 2px solid var(--primary-color);
  margin: 1.5rem 0;
  width: 50%;
  margin-left: auto;
  margin-right: auto;
}
@media (max-width: 768px) {
  .button-row {
    flex-direction: column;
    gap: 0.5rem;
    align-items: center;
  }
  .button-row .button {
    width: 90%;
    max-width: 15em;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="svg-wrapper">
      <span class="header-title">CALOR RUN</span>
      <div id="animSvgContainer"></div>
    </div>
  </div>

  <div class="button-row">
    <a href="live_trail.html" class="button">Live Trail</a>
  </div>
  <hr class="separator">
  <div class="button-row">
    <a href="podiums.html" class="button">Podiums</a>
  </div>
  <div class="button-row">
    <a href="resultats.html?distance=10" class="button">Résultats 10 km</a>
    <a href="resultats.html?distance=20" class="button">Résultats 20 km</a>
  </div>
    <hr class="separator">
  <div class="button-row">
    <a href="participants.html" class="button">Participants</a>
    <a href="statistiques.html" class="button">Statistiques</a>
  </div>
  <div class="button-row">
    <a href="historique.html" class="button">Historique</a>
  </div>
</div>
<script src="svg-logo.js"></script>
<script src="svg-animation.js"></script>
<script>
'use strict';
const year = new Date().getFullYear();
document.title = `Calor Run ${year}`;
</script>
</body>
</html>
