<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saisie Rapide</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

#app { width: min(90%, 360px); text-align: center; }

/* Message de statut */
#status { height: 32px; margin-bottom: 12px; font-size: 22px; font-weight: bold; color: #222; }
#status.ok  { color: #2e7d32; }
#status.err { color: #c62828; }

/* Saisie */
#num {
    width: 100%;
    height: 80px;
    padding: 10px;
    font-size: 48px;
    text-align: center;
    border: 2px solid #ccc;
    border-radius: 8px;
    outline: none;
}
#num.err { border-color: #c62828; }

/* Synchronisation */
#syncBar { margin-top: 15px; }
#syncBtn {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 6px;
    background: #65c015;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
#syncBtn:disabled { background: #9e9e9e; cursor: default; }

#pendingCount { display: block; margin-top: 8px; font-size: 16px; color: #555; }

/* Liste d'attente */
#pendingList {
    list-style: none;
    text-align: left;
    margin: 12px 0 0;
    padding: 0;
    max-height: 160px;
    overflow-y: auto;
}
#pendingList li {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px;
    font-size: 14px;
    color: #555;
    border-bottom: 1px solid #e0e0e0;
}
#pendingList li.err { color: #c62828; font-weight: bold; }

/* Suppression */
#dangerZone { margin-top: 30px; }
#clearDbBtn {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 6px;
    background: #c62828;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
#clearDbBtn:hover { background: #b71c1c; }
</style>
</head>

<body>
<div id="app">
    <div id="status" aria-live="polite"></div>

    <form id="form" autocomplete="off">
        <input
            id="num"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            autofocus
            enterkeyhint="send"
            placeholder="N°"
        >
    </form>

    <div id="syncBar">
        <button id="syncBtn" type="button" disabled>Synchroniser</button>
        <span id="pendingCount">0 en attente</span>
    </div>

    <ul id="pendingList"></ul>

    <div id="dangerZone">
        <button id="clearDbBtn" type="button">🗑 Supprimer les données</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

/* =========================================================
   CONFIGURATION
   ========================================================= */

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
    authDomain: "calor-run.firebaseapp.com",
    databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "calor-run",
    storageBucket: "calor-run.firebasestorage.app",
    messagingSenderId: "329949291334",
    appId: "1:329949291334:web:c71ef20268c609cf953b47",
    measurementId: "G-YVQPW6JGPK"
};

const STORAGE_KEY = "saisie-rapide-tampon";
const RETRY_DEPART_MS = 5000;   // nouvelle tentative si le départ n'a pas pu être chargé
const AUTO_SYNC_MS = 5000;      // synchronisation automatique en arrière-plan
const ANTI_REBOND_MS = 400;     // anti double-saisie sur la même valeur

/* =========================================================
   FIREBASE
   ========================================================= */

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);

/* =========================================================
   RÉFÉRENCES DOM
   ========================================================= */

const form = document.getElementById("form");
const input = document.getElementById("num");
const statusEl = document.getElementById("status");
const syncBtn = document.getElementById("syncBtn");
const pendingCountEl = document.getElementById("pendingCount");
const pendingListEl = document.getElementById("pendingList");
const clearDbBtn = document.getElementById("clearDbBtn");

/* =========================================================
   ÉTAT
   ========================================================= */

let departCourse = null;
let buffer = chargerTampon();
let syncing = false;
let dernierAjout = { valeur: null, t: 0 };
let statusTimer = null;

/* =========================================================
   STATUT / MESSAGES
   ========================================================= */

function showStatus(text, cls, ttl = 700) {
    statusEl.textContent = text;
    statusEl.className = cls;
    input.classList.toggle("err", cls === "err");

    clearTimeout(statusTimer);
    if (ttl) {
        statusTimer = setTimeout(() => {
            statusEl.textContent = "";
            statusEl.className = "";
            input.classList.remove("err");
        }, ttl);
    }
}

/* =========================================================
   PERSISTANCE LOCALE (tampon hors-ligne)
   ========================================================= */

function chargerTampon() {
    try {
        const brut = localStorage.getItem(STORAGE_KEY);
        return brut ? JSON.parse(brut) : [];
    } catch (e) {
        console.error("Lecture tampon impossible :", e);
        return [];
    }
}

function sauvegarderTampon() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(buffer));
    } catch (e) {
        console.error("Sauvegarde tampon impossible :", e);
    }
}

function nouvelId() {
    return crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random();
}

/* =========================================================
   AFFICHAGE DU TAMPON
   ========================================================= */

function renderBuffer() {
    pendingCountEl.textContent = buffer.length + " en attente";
    syncBtn.disabled = syncing || buffer.length === 0;

    pendingListEl.innerHTML = "";
    for (const entree of buffer) {
        const li = document.createElement("li");
        li.textContent = entree.valeur + (entree.error ? " — erreur" : "");
        if (entree.error) li.className = "err";
        pendingListEl.appendChild(li);
    }

    sauvegarderTampon();
}

/* =========================================================
   CHARGEMENT DU DÉPART DE COURSE
   ========================================================= */

async function chargerDepartCourse() {
    try {
        const snapshot = await get(ref(db, "data/depart_course"));
        if (snapshot.exists()) {
            departCourse = new Date(snapshot.val()).getTime();
        } else {
            showStatus("⚠ Départ introuvable", "err", 3000);
            setTimeout(chargerDepartCourse, RETRY_DEPART_MS);
        }
    } catch (err) {
        showStatus("⚠ Erreur connexion", "err", 3000);
        setTimeout(chargerDepartCourse, RETRY_DEPART_MS);
    }
}

/* =========================================================
   AJOUT D'UNE SAISIE
   ========================================================= */

function envoyer(e) {
    if (e) e.preventDefault();

    const valeur = input.value.trim();
    if (!valeur) return;

    if (!/^[0-9]+$/.test(valeur)) {
        showStatus("⚠ Numéro invalide", "err", 1500);
        return;
    }

    if (!departCourse) {
        showStatus("⚠ Départ de course indisponible", "err", 3000);
        return;
    }

    // Anti double-saisie (ex: double appui / rebond du scanner)
    const maintenant = Date.now();
    if (valeur === dernierAjout.valeur && maintenant - dernierAjout.t < ANTI_REBOND_MS) {
        return;
    }
    dernierAjout = { valeur, t: maintenant };

    // Temps écoulé depuis le départ, converti en fraction de journée Excel
    // (ex: départ à 07:00:00, saisie à 07:05:30 -> 330s -> 0,003819... jour)
    const excelTime = (maintenant - departCourse) / 86400000;

    // Une nouvelle saisie du même dossard remplace toujours la précédente,
    // y compris si l'ancienne était encore en attente de synchronisation.
    buffer = buffer.filter(entree => entree.valeur !== valeur);
    buffer.push({ id: nouvelId(), valeur, excelTime, error: false });

    input.value = "";
    showStatus("✔ Ajouté", "ok");
    input.focus();
    renderBuffer();
}

/* =========================================================
   SYNCHRONISATION FIREBASE
   ========================================================= */

async function synchroniser() {
    if (syncing || buffer.length === 0) return;

    syncing = true;
    syncBtn.textContent = "Synchronisation…";
    renderBuffer();

    // Copie du tampon au début de la synchronisation
    const aEnvoyer = [...buffer];

    const resultats = await Promise.allSettled(
        aEnvoyer.map(entree =>
            set(ref(db, "saisie/" + entree.valeur), entree.excelTime).then(() => entree.id)
        )
    );

    const idsReussis = new Set(
        resultats.filter(r => r.status === "fulfilled").map(r => r.value)
    );
    const idsTentes = new Set(aEnvoyer.map(e => e.id));

    // On retire les envois réussis, on marque en erreur ceux qui ont échoué
    buffer = buffer
        .filter(e => !idsReussis.has(e.id))
        .map(e => idsTentes.has(e.id) ? { ...e, error: true } : e);

    const nbReussis = idsReussis.size;
    const nbEchecs = aEnvoyer.length - nbReussis;

    if (nbEchecs === 0) {
        showStatus(`✔ ${nbReussis} synchronisé(s)`, "ok");
    } else {
        showStatus(`⚠ ${nbReussis} synchronisé(s), ${nbEchecs} en erreur`, "err", 0);
    }

    syncing = false;
    syncBtn.textContent = "Synchroniser";
    renderBuffer();
}

/* =========================================================
   SUPPRESSION DE LA BASE
   ========================================================= */

async function viderBase() {
    if (!confirm("Supprimer toutes les données ?")) return;
    try {
        await remove(ref(db, "saisie"));
        showStatus("🗑 Base supprimée", "ok", 3000);
    } catch (err) {
        showStatus("Erreur suppression", "err", 3000);
    }
}

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */

form.addEventListener("submit", envoyer);
syncBtn.addEventListener("click", synchroniser);
clearDbBtn.addEventListener("click", viderBase);

window.addEventListener("load", () => input.focus());
document.addEventListener("click", () => input.focus());

/* =========================================================
   INITIALISATION
   ========================================================= */

if (buffer.length > 0) {
    showStatus(`↻ ${buffer.length} entrée(s) restaurée(s) — à synchroniser`, "err", 0);
}

renderBuffer();
chargerDepartCourse();
setInterval(synchroniser, AUTO_SYNC_MS); // tentative de sync auto en tâche de fond
</script>

</body>
</html>
