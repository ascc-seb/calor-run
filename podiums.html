<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podiums Calor Run</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥇</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
    --primary-color: #215E99;
    --secondary-color: #E61780;
    --bg-white: #fff;
    --bg-light: #f9f9f9;
    --shadow: rgba(0, 0, 0, 0.15);
    --border-radius: 0.5rem;
    --max-width: 62.5rem;
    --text-dark: #333;
    --border-light: #ddd;
    --header-bg: #e0e0e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    color: var(--text-dark);
    min-height: 100vh;
    padding: 1.25rem;
    position: relative;
}
body::before {
  content:''; position: fixed; inset:0;
  background: linear-gradient(0.25turn, var(--primary-color), var(--secondary-color));
  opacity:0.3;
  z-index:-1;
  pointer-events: none;
}
.container { max-width: var(--max-width); margin:0 auto; }
.header {
  text-align:center;
  margin-bottom:0.625rem;
  color: var(--primary-color);
  font-size:1.3rem;
  font-weight:bold;
  padding:1.25rem 1.25rem 3.75rem;
  background:url('calor.png') center/contain no-repeat;
}
.table-container {
  max-width: var(--max-width);
  overflow-x:auto;
  margin:0 auto 1.25rem;
  background: var(--bg-white);
  border-radius: var(--border-radius);
  box-shadow: 0 0.25rem 0.75rem var(--shadow);
}
table { width:100%; border-collapse: collapse; table-layout: fixed; min-width:43.75rem; }
th, td { padding:0.375rem 0.5rem; border-bottom:1px solid var(--border-light); text-align:left; white-space: nowrap; }
th { background: var(--header-bg); font-weight:600; position:sticky; top:0; z-index:10; }
table th:nth-child(1),
table td:nth-child(1) { width: 90px; text-align: left; }
table th:nth-child(2),
table td:nth-child(2) { width: auto; }
table th:nth-child(3),
table td:nth-child(3) { width: auto; }
table th:nth-child(4),
table td:nth-child(4) { width: 90px; text-align: center; }
table th:nth-child(5),
table td:nth-child(5) { width: 100px; text-align: center; }
#table-clubs th:nth-child(3),
#table-clubs td:nth-child(3) { width: 100px; text-align: center; }
#table-clubs th:nth-child(4),
#table-clubs td:nth-child(4) { width: 120px; text-align: center; }
tbody tr:nth-child(even){ background: var(--bg-light); }
.text-center { text-align:center; }
.loading { text-align:center; padding:1.25rem 0; font-size:1rem; }
.hidden { display:none; }

.filter-bar { text-align:center; margin-bottom:1rem; }
.filter-bar a {
    margin:0 0.25rem;
    font-size:1rem;
    cursor:pointer;
}
.filter-bar a.active { text-decoration: underline; }
.filter-bar select {
    margin-left:1rem;
    padding:0.25rem 0.5rem;
    font-size:0.9rem;
    border:1px solid var(--primary-color);
    border-radius: var(--border-radius);
    background: var(--bg-white);
    color: var(--text-dark);
}

@media (max-width: 768px) {
  .header { margin-bottom:0.625rem; padding:0rem 0rem 1.5rem; font-size:0.75rem; }
  table { width: auto; font-size:0.85rem; }
  th, td { padding:0.375rem 0.5rem; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">PODIUMS CALOR RUN</div>
    <div class="filter-bar hidden" id="filter-bar">
        <a data-course="10km" class="filter-course" style="color:var(--primary-color)">10 km</a> • <a data-course="20km" class="filter-course" style="color:var(--secondary-color)">20 km</a>
        <select id="filter-cat">
            <option value="">Toutes catégories</option>
        </select>
    </div>
</div>

<div id="tables" class="hidden">

  <!-- Tableau Hommes -->
  <div class="table-container">
      <h3 style="color:var(--primary-color);">&nbsp;Podium Hommes</h3>
      <table id="table-homme">
          <thead>
              <tr>
                  <th>Podium</th>
                  <th>Nom</th>
                  <th>Prénom</th>
                  <th>Temps</th>
                  <th>Catégorie</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
  </div>

  <!-- Tableau Femmes -->
  <div class="table-container">
      <h3 style="color:var(--secondary-color);">&nbsp;Podium Femmes</h3>
      <table id="table-femme">
          <thead>
              <tr>
                  <th>Podium</th>
                  <th>Nom</th>
                  <th>Prénom</th>
                  <th>Temps</th>
                  <th>Catégorie</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
  </div>

  <!-- Tableau Clubs -->
  <div class="table-container">
      <h3 style="color:var(--primary-color);">&nbsp;Podium Clubs</h3>
      <table id="table-clubs">
          <thead>
              <tr>
                  <th>Classement</th>
                  <th>Club</th>
                  <th>Inscrits</th>
                  <th>Km totaux</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
  </div>

  <div id="loading" class="loading">Connexion...</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
'use strict';

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
    authDomain: "calor-run.firebaseapp.com",
    databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "calor-run",
    storageBucket: "calor-run.firebasestorage.app",
    messagingSenderId: "329949291334",
    appId: "1:329949291334:web:c71ef20268c609cf953b47",
    measurementId: "G-YVQPW6JGPK"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

const elements = {
    loading: document.getElementById('loading'),
    filterBar: document.getElementById('filter-bar'),
    filterCat: document.getElementById('filter-cat'),
    tables: document.getElementById('tables'),
    tableHomme: document.querySelector('#table-homme tbody'),
    tableFemme: document.querySelector('#table-femme tbody'),
    tableClubs: document.querySelector('#table-clubs tbody')
};

let participants = {};
let liveScratch = {};
let selectedCourse = '10km';

// Distance (en km) associée à chaque course, utilisée pour le total kilométrique des clubs
const COURSE_KM = {
    '10km': 10,
    '20km': 20
};

function normalizeCourse(course) {

    const value = String(course || '').trim();

    switch (value) {

        case '10':
        case '10km':
        case '10 km':
            return '10km';

        case '20':
        case '20km':
        case '20 km':
            return '20km';

        default:
            return value;
    }
}

function excelFractionToMs(excelValue) {

    const fraction = Number(excelValue) % 1;

    return fraction * 24 * 60 * 60 * 1000;
}

function formatTime(ms) {

    const totalSeconds = Math.floor(ms / 1000);

    const hours = Math.floor(totalSeconds / 3600);

    const minutes = Math.floor(
        (totalSeconds % 3600) / 60
    );

    const seconds = totalSeconds % 60;

    return `${hours.toString().padStart(2,'0')}:${minutes
        .toString().padStart(2,'0')}:${seconds
        .toString().padStart(2,'0')}`;
}

function getRanking(courseFilter, categoryFilter, genderFilter) {

    return Object.entries(liveScratch)

        .map(([dossard, excelValue]) => {

            const participant =
                participants[dossard];

            if (!participant) {
                return null;
            }

            return {
                dossard,
                nom: participant.nom || '',
                prenom: participant.prenom || '',
                categorie: participant.categorie || '',
                genre: participant.genre || '',
                course: normalizeCourse(participant.course),
                tempsMs: excelFractionToMs(excelValue)
            };
        })

        .filter(Boolean)

        .filter(item => {

            const courseOK =
                !courseFilter ||
                item.course === courseFilter;

            const categoryOK =
                !categoryFilter ||
                item.categorie === categoryFilter;

            const genderOK =
                !genderFilter ||
                item.genre === genderFilter;

            return courseOK &&
                   categoryOK &&
                   genderOK;
        })

        .sort((a,b) => a.tempsMs - b.tempsMs)

        .slice(0,3)

        .map(item => ({
            ...item,
            tempsStr: formatTime(
                item.tempsMs
            )
        }));
}

// Classement des 3 clubs les plus représentés (toutes courses confondues),
// avec le nombre total d'inscrits et le nombre total de km parcourus par le club
function getClubRanking() {

    const clubs = {};

    Object.values(participants)
        .forEach(p => {

            const clubName =
                (p.club || '').trim();

            if (!clubName) {
                return;
            }

            const course =
                normalizeCourse(p.course);

            const km =
                COURSE_KM[course] || 0;

            if (!clubs[clubName]) {
                clubs[clubName] = {
                    club: clubName,
                    inscrits: 0,
                    km: 0
                };
            }

            clubs[clubName].inscrits += 1;
            clubs[clubName].km += km;
        });

    return Object.values(clubs)
        .sort((a,b) => b.inscrits - a.inscrits)
        .slice(0,3);
}

function renderTable(tbody, classement, femme = false) {

    tbody.innerHTML = '';

    const podiums = femme
        ? ['🥇 1ère','🥈 2ème','🥉 3ème']
        : ['🥇 1er','🥈 2ème','🥉 3ème'];

    for(let i = 0 ; i < 3 ; i++) {

        const p = classement[i];

        const tr =
            document.createElement('tr');

        tr.innerHTML = `
            <td>${podiums[i]}</td>
            <td>${p ? p.nom : ''}</td>
            <td>${p ? p.prenom : ''}</td>
            <td>${p ? p.tempsStr : ''}</td>
            <td>${p ? p.categorie : ''}</td>
        `;

        tbody.appendChild(tr);
    }
}

function renderClubTable(tbody, classement) {

    tbody.innerHTML = '';

    const podiums = ['🥇 1er','🥈 2ème','🥉 3ème'];

    for(let i = 0 ; i < 3 ; i++) {

        const c = classement[i];

        const tr =
            document.createElement('tr');

        tr.innerHTML = `
            <td>${podiums[i]}</td>
            <td>${c ? c.club : ''}</td>
            <td>${c ? c.inscrits : ''}</td>
            <td>${c ? c.km : ''}</td>
        `;

        tbody.appendChild(tr);
    }
}

function updateTables() {

    const categoryFilter =
        elements.filterCat.value;

    const podiumHommes =
        getRanking(
            selectedCourse,
            categoryFilter,
            'H'
        );

    const podiumFemmes =
        getRanking(
            selectedCourse,
            categoryFilter,
            'F'
        );

    renderTable(
        elements.tableHomme,
        podiumHommes,
        false
    );

    renderTable(
        elements.tableFemme,
        podiumFemmes,
        true
    );
}

function updateClubTable() {

    renderClubTable(
        elements.tableClubs,
        getClubRanking()
    );
}

function populateCategories() {

    const categories = new Set();

    Object.values(participants)
        .forEach(p => {

            if(p.categorie) {
                categories.add(
                    p.categorie
                );
            }
        });

    const sorted =
        [...categories].sort((a,b) => {

            const order = {
                CA: 1,
                JU: 2,
                ES: 3,
                SE: 4
            };

            const aMaster =
                /^M\d+$/.test(a);

            const bMaster =
                /^M\d+$/.test(b);

            if(aMaster && bMaster) {

                return parseInt(a.slice(1))
                     - parseInt(b.slice(1));
            }

            return (order[a] || 999)
                 - (order[b] || 999);
        });

    elements.filterCat.innerHTML =
        '<option value="">Toutes catégories</option>';

    sorted.forEach(cat => {

        const option =
            document.createElement('option');

        option.value = cat;
        option.textContent = cat;

        elements.filterCat.appendChild(option);
    });
}

db.ref('participants')
.on('value', snapshot => {

    participants =
        snapshot.val() || {};

    populateCategories();

    elements.loading.classList.add(
        'hidden'
    );

    elements.filterBar.classList.remove(
        'hidden'
    );

    elements.tables.classList.remove(
        'hidden'
    );

    updateTables();
    updateClubTable();
});

db.ref('live_scratch')
.on('value', snapshot => {

    liveScratch =
        snapshot.val() || {};

    updateTables();
});

elements.filterCat
.addEventListener(
    'change',
    updateTables
);

document
.querySelectorAll('.filter-course')
.forEach(link => {

    link.addEventListener(
        'click',
        e => {

            selectedCourse =
                e.target.dataset.course;

            document
                .querySelectorAll('.filter-course')
                .forEach(btn =>
                    btn.classList.remove(
                        'active'
                    )
                );

            e.target.classList.add(
                'active'
            );

            updateTables();
        }
    );
});

document
.querySelector(
    '.filter-course[data-course="10km"]'
)
?.classList.add('active');

</script>
</body>
</html>
