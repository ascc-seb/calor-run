<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podiums Calor Run</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥇</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
    --primary-color: #215E99;
    --secondary-color: #E61780;
    --bg-white: #fff;
    --bg-light: #f9f9f9;
    --shadow: rgba(0, 0, 0, 0.15);
    --border-radius: 0.5rem;
    --max-width: 62.5rem;
    --text-dark: #333;
    --border-light: #ddd;
    --header-bg: #e0e0e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    color: var(--text-dark);
    min-height: 100vh;
    padding: 1.25rem;
    position: relative;
}
body::before {
  content:''; position: fixed; inset:0;
  background: linear-gradient(0.25turn, var(--primary-color), var(--secondary-color));
  opacity:0.3;
  z-index:-1;
  pointer-events: none;
}
.container { max-width: var(--max-width); margin:0 auto; }
.header {
  text-align:center;
  margin-bottom:0.625rem;
  color: var(--primary-color);
  font-size:1.3rem;
  font-weight:bold;
  padding:1.25rem 1.25rem 3.75rem;
  background:url('calor.png') center/contain no-repeat;
}
.table-container {
  max-width: var(--max-width);
  overflow-x:auto;
  margin:0 auto 1.25rem;
  background: var(--bg-white);
  border-radius: var(--border-radius);
  box-shadow: 0 0.25rem 0.75rem var(--shadow);
}
table { width:100%; border-collapse: collapse; table-layout: fixed; min-width:43.75rem; }
th, td { padding:0.375rem 0.5rem; border-bottom:1px solid var(--border-light); text-align:left; white-space: nowrap; }
th { background: var(--header-bg); font-weight:600; position:sticky; top:0; z-index:10; }
table th:nth-child(1),
table td:nth-child(1) { width: 90px; text-align: left; }
table th:nth-child(2),
table td:nth-child(2) { width: auto; }
table th:nth-child(3),
table td:nth-child(3) { width: auto; }
table th:nth-child(4),
table td:nth-child(4) { width: 90px; text-align: center; }
table th:nth-child(5),
table td:nth-child(5) { width: 100px; text-align: center; }
tbody tr:nth-child(even){ background: var(--bg-light); }
.text-center { text-align:center; }
.loading { text-align:center; padding:1.25rem 0; font-size:1rem; }
.hidden { display:none; }

.filter-bar { text-align:center; margin-bottom:1rem; }
.filter-bar a {
    margin:0 0.25rem;
    font-size:1rem;
    cursor:pointer;
}
.filter-bar a.active { text-decoration: underline; }
.filter-bar select {
    margin-left:1rem;
    padding:0.25rem 0.5rem;
    font-size:0.9rem;
    border:1px solid var(--primary-color);
    border-radius: var(--border-radius);
    background: var(--bg-white);
    color: var(--text-dark);
}

@media (max-width: 768px) {
  .header { margin-bottom:0.625rem; padding:0rem 0rem 1.5rem; font-size:0.75rem; }
  table { width: auto; font-size:0.85rem; }
  th, td { padding:0.375rem 0.5rem; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">PODIUMS CALOR RUN</div>
    <div class="filter-bar hidden" id="filter-bar">
        <a data-course="10km" class="filter-course" style="color:var(--primary-color)">10 km</a> • <a data-course="20km" class="filter-course" style="color:var(--secondary-color)">20 km</a>
        <select id="filter-cat">
            <option value="">Toutes catégories</option>
        </select>
    </div>
</div>

<div id="tables" class="hidden">

  <!-- Tableau Hommes -->
  <div class="table-container">
      <h3 style="color:var(--primary-color);">&nbsp;Podium Hommes</h3>
      <table id="table-homme">
          <thead>
              <tr>
                  <th>Podium</th>
                  <th>Nom</th>
                  <th>Prénom</th>
                  <th>Temps</th>
                  <th>Catégorie</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
  </div>

  <!-- Tableau Femmes -->
  <div class="table-container">
      <h3 style="color:var(--secondary-color);">&nbsp;Podium Femmes</h3>
      <table id="table-femme">
          <thead>
              <tr>
                  <th>Podium</th>
                  <th>Nom</th>
                  <th>Prénom</th>
                  <th>Temps</th>
                  <th>Catégorie</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
  </div>
  <div id="loading" class="loading">Connexion...</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
'use strict';

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
    authDomain: "calor-run.firebaseapp.com",
    databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "calor-run",
    storageBucket: "calor-run.firebasestorage.app",
    messagingSenderId: "329949291334",
    appId: "1:329949291334:web:c71ef20268c609cf953b47",
    measurementId: "G-YVQPW6JGPK"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

const elements = {
    loading: document.getElementById('loading'),
    filterBar: document.getElementById('filter-bar'),
    filterCat: document.getElementById('filter-cat'),
    tables: document.getElementById('tables'),
    tableHomme: document.querySelector('#table-homme tbody'),
    tableFemme: document.querySelector('#table-femme tbody')
};

let departureTimestamp = null;
let participants = {};
let liveScratch = {};
let selectedCourse = '10km';

function normalizeCourse(value) {
    if (value === undefined || value === null) {return '';}
    const v = String(value).trim();
    switch (v) {
        case '10':
        case '10km':
        case '10 km':
            return '10km';
        case '20':
        case '20km':
        case '20 km':
            return '20km';
        default:
            return '';
    }
}

function excelDateToJS(excelDate) {
    return new Date((Number(excelDate) - 25569) * 86400 * 1000);
}

function formatTime(ms) {
    if (ms < 0) return '--:--:--';
    const totalSeconds = Math.floor(ms / 1000);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')    }`;
}

function getRanking(courseFilter, categoryFilter, genderFilter) {
    if (!departureTimestamp) {return [];}
    return Object.entries(liveScratch)
        .map(([dossard, excelTime]) => {
            const participant = participants[dossard];
            if (!participant) {return null;}
            const scanDate = excelDateToJS(excelTime);
            const tempsMs = scanDate.getTime() - departureTimestamp;
            return {
                dossard,
                nom: participant.nom || '',
                prenom: participant.prenom || '',
                categorie: participant.categorie || '',
                genre: participant.genre || '',
                course: normalizeCourse(participant.course),
                tempsMs,
                tempsStr: formatTime(tempsMs)
            };
        })
        .filter(Boolean)
        .filter(r => {
            const courseOK = !courseFilter || r.course === courseFilter;
            const catOK = !categoryFilter || r.categorie === categoryFilter;
            const genreOK = !genderFilter || r.genre === genderFilter;
            return courseOK && catOK && genreOK;
        })
        .sort((a, b) => a.tempsMs - b.tempsMs)
        .slice(0, 3);
}

function renderTable(tbody, classement, femme = false) {

    tbody.innerHTML = '';

    const podiums = femme
        ? ['🥇 1ère', '🥈 2ème', '🥉 3ème']
        : ['🥇 1er', '🥈 2ème', '🥉 3ème'];

    podiums.forEach((libelle, index) => {

        const p = classement[index];

        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${libelle}</td>
            <td>${p ? p.nom : ''}</td>
            <td>${p ? p.prenom : ''}</td>
            <td>${p ? p.tempsStr : ''}</td>
            <td>${p ? p.categorie : ''}</td>
        `;

        tbody.appendChild(tr);
    });
}

function updateTables() {

    if (!departureTimestamp) {
        return;
    }

    const categoryFilter =
        elements.filterCat.value;

    const topHommes =
        getRanking(
            selectedCourse,
            categoryFilter,
            'H'
        );

    const topFemmes =
        getRanking(
            selectedCourse,
            categoryFilter,
            'F'
        );

    renderTable(
        elements.tableHomme,
        topHommes,
        false
    );

    renderTable(
        elements.tableFemme,
        topFemmes,
        true
    );
}

function populateCategories() {

    const categories = [...new Set(
        Object.values(participants)
            .map(p => p.categorie)
            .filter(Boolean)
    )];

    categories.sort((a, b) => {

        const order = {
            CA: 1,
            JU: 2,
            ES: 3,
            SE: 4
        };

        const aM = /^M\d+$/.test(a);
        const bM = /^M\d+$/.test(b);

        if (aM && bM) {
            return parseInt(a.slice(1))
                 - parseInt(b.slice(1));
        }

        return (order[a] || 999)
             - (order[b] || 999);
    });

    elements.filterCat.innerHTML =
        '<option value="">Toutes catégories</option>';

    categories.forEach(cat => {

        const option =
            document.createElement('option');

        option.value = cat;
        option.textContent = cat;

        elements.filterCat.appendChild(option);
    });
}

db.ref('data/depart_course')
.on('value', snap => {

    if (snap.exists()) {

        departureTimestamp =
            new Date(snap.val()).getTime();

        updateTables();
    }
});

db.ref('participants')
.on('value', snap => {

    participants = snap.val() || {};

    populateCategories();

    elements.loading.classList.add('hidden');
    elements.filterBar.classList.remove('hidden');
    elements.tables.classList.remove('hidden');

    updateTables();
});

db.ref('live_scratch')
.on('value', snap => {

    liveScratch = snap.val() || {};

    updateTables();
});

elements.filterCat.addEventListener(
    'change',
    updateTables
);

document
.querySelectorAll('.filter-course')
.forEach(link => {

    link.addEventListener('click', e => {

        selectedCourse =
            e.target.dataset.course;

        document
            .querySelectorAll('.filter-course')
            .forEach(btn =>
                btn.classList.remove('active')
            );

        e.target.classList.add('active');

        updateTables();
    });
});

document
.querySelector(
        '.filter-course[data-course="10km"]'
)
?.classList.add('active');

</script>
</body>
</html>
