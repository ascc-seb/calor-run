<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test Google Photos</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 14px;
      margin: 6px;
      cursor: pointer;
    }

    #photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    #photos img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <h1>Test Google Photos</h1>

  <button id="loginButton">Connexion Google</button>
  <button id="pickerButton">Choisir des photos</button>

  <p id="status">Chargement...</p>

  <div id="photos"></div>


  <script>
    const CLIENT_ID =
      "329949291334-vdb1rv1il611ej0uvd2pj4oqmrhqno73.apps.googleusercontent.com";

    const SCOPES =
      "https://www.googleapis.com/auth/photospicker.mediaitems.readonly";

    let tokenClient = null;
    let accessToken = null;
    let currentSessionId = null;


    // --------------------------------------------------
    // INITIALISATION
    // --------------------------------------------------

    window.addEventListener("load", function () {

      console.log("Page chargée");

      const status = document.getElementById("status");

      // Vérification Google Identity Services
      if (
        !window.google ||
        !window.google.accounts ||
        !window.google.accounts.oauth2
      ) {
        status.innerText =
          "ERREUR : Google Identity Services n'est pas chargé.";

        console.error(
          "window.google.accounts.oauth2 est introuvable."
        );

        return;
      }

      console.log(
        "Google Identity Services correctement chargé."
      );


      // Création du client OAuth
      tokenClient = google.accounts.oauth2.initTokenClient({

        client_id: CLIENT_ID,

        scope: SCOPES,

        callback: function (tokenResponse) {

          console.log(
            "Réponse OAuth :",
            tokenResponse
          );

          if (tokenResponse.error) {

            status.innerText =
              "Erreur OAuth : " +
              tokenResponse.error;

            console.error(
              "Erreur OAuth :",
              tokenResponse
            );

            return;
          }

          accessToken =
            tokenResponse.access_token;

          status.innerText =
            "Connecté à Google.";

          console.log(
            "Access Token reçu."
          );
        }

      });


      if (tokenClient) {

        console.log(
          "tokenClient correctement initialisé."
        );

        status.innerText =
          "Prêt. Tu peux te connecter à Google.";

      } else {

        status.innerText =
          "ERREUR : impossible d'initialiser tokenClient.";

      }

    });


    // --------------------------------------------------
    // CONNEXION GOOGLE
    // --------------------------------------------------

    document
      .getElementById("loginButton")
      .addEventListener("click", function () {

        console.log(
          "Connexion Google demandée"
        );

        if (!tokenClient) {

          document.getElementById("status").innerText =
            "ERREUR : tokenClient non initialisé.";

          console.error(
            "tokenClient = null"
          );

          return;
        }

        tokenClient.requestAccessToken();

      });


    // --------------------------------------------------
    // GOOGLE PHOTOS PICKER
    // --------------------------------------------------

    document
      .getElementById("pickerButton")
      .addEventListener("click", startPicker);


    async function startPicker() {

      console.log(
        "Démarrage Google Photos Picker"
      );


      if (!accessToken) {

        alert(
          "Connecte-toi d'abord à Google."
        );

        return;
      }


      document.getElementById("status").innerText =
        "Création de la session Google Photos...";


      try {

        const sessionResponse = await fetch(
          "https://photospicker.googleapis.com/v1/sessions",
          {
            method: "POST",

            headers: {
              "Authorization":
                "Bearer " + accessToken,

              "Content-Type":
                "application/json"
            },

            body: "{}"
          }
        );


        const session =
          await sessionResponse.json();


        console.log(
          "Session Picker :",
          session
        );


        if (
          !session.id ||
          !session.pickerUri
        ) {

          document.getElementById("status").innerText =
            "Erreur création session : " +
            JSON.stringify(session);

          return;
        }


        currentSessionId =
          session.id;


        window.open(
          session.pickerUri + "/autoclose",
          "_blank"
        );


        document.getElementById("status").innerText =
          "Sélectionne tes photos dans Google Photos...";


        pollSession();

      } catch (error) {

        console.error(
          "Erreur Picker :",
          error
        );

        document.getElementById("status").innerText =
          "Erreur : " +
          error.message;

      }

    }


    // --------------------------------------------------
    // SURVEILLER LA SESSION
    // --------------------------------------------------

    async function pollSession() {

      const interval =
        setInterval(async function () {

          try {

            const response =
              await fetch(
                "https://photospicker.googleapis.com/v1/sessions/" +
                currentSessionId,
                {
                  headers: {
                    "Authorization":
                      "Bearer " +
                      accessToken
                  }
                }
              );


            const sessionStatus =
              await response.json();


            console.log(
              "Statut session :",
              sessionStatus
            );


            if (
              sessionStatus.mediaItemsSet === true
            ) {

              clearInterval(interval);


              document.getElementById("status").innerText =
                "Photos sélectionnées. Chargement...";


              listSelectedPhotos();

            }

          } catch (error) {

            console.error(
              "Erreur vérification session :",
              error
            );

          }

        }, 3000);

    }


    // --------------------------------------------------
    // RÉCUPÉRER LES PHOTOS
    // --------------------------------------------------

    async function listSelectedPhotos() {

      try {

        const response =
          await fetch(
            "https://photospicker.googleapis.com/v1/mediaItems?sessionId=" +
            currentSessionId +
            "&pageSize=100",
            {
              headers: {
                "Authorization":
                  "Bearer " +
                  accessToken
              }
            }
          );


        const data =
          await response.json();


        console.log(
          "Photos récupérées :",
          data
        );


        const container =
          document.getElementById("photos");


        container.innerHTML = "";


        if (
          !data.mediaItems ||
          data.mediaItems.length === 0
        ) {

          document.getElementById("status").innerText =
            "Aucune photo sélectionnée.";

          return;
        }


        data.mediaItems.forEach(
          function (item) {

            const img =
              document.createElement("img");


            img.src =
              item.mediaFile.baseUrl +
              "=w600-h600";


            img.alt =
              item.mediaFile.filename ||
              "Photo Google Photos";


            container.appendChild(img);

          }
        );


        document.getElementById("status").innerText =
          data.mediaItems.length +
          " photo(s) affichée(s).";


      } catch (error) {

        console.error(
          "Erreur récupération photos :",
          error
        );

        document.getElementById("status").innerText =
          "Erreur récupération photos : " +
          error.message;

      }

    }

  </script>

</body>
</html>
