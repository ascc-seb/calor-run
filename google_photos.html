
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Visionneuse Google Photos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 14px;
      margin: 6px;
      cursor: pointer;
    }

    #photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    #photos img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>Mes photos Google Photos</h1>

  <button onclick="loginGoogle()">Connexion Google</button>
  <button onclick="startPicker()">Choisir des photos</button>

  <p id="status"></p>
  <div id="photos"></div>

  <script src="https://accountssi/clientscript>

  <script>
    const CLIENT_ID = "329949291334-vdb1rv1il611ej0uvd2pj4oqmrhqno73.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/photospicker.mediaitems.readonly";

    let tokenClient;
    let accessToken = null;
    let currentSessionId = null;

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          accessToken = tokenResponse.access_token;
          document.getElementById("status").innerText = "Connecté à Google.";
        }
      });
    };

    function loginGoogle() {
      tokenClient.requestAccessToken();
    }

    async function startPicker() {
      if (!accessToken) {
        alert("Connecte-toi d'abord à Google.");
        return;
      }

      document.getElementById("status").innerText = "Création de la session Google Photos...";

      const sessionResponse = await fetch("https://photospicker.googleapis.com/v1/sessions", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: "{}"
      });

      const session = await sessionResponse.json();

      currentSessionId = session.id;

      const pickerUrl = session.pickerUri + "/autoclose";

      window.open(pickerUrl, "_blank");

      document.getElementById("status").innerText = "Sélectionne tes photos dans Google Photos...";

      pollSession();
    }

    async function pollSession() {
      const interval = setInterval(async () => {
        const response = await fetch(
          `https://photospicker.googleapis.com/v1/sessions/${currentSessionId}`,
          {
            headers: {
              "Authorization": "Bearer " + accessToken
            }
          }
        );

        const sessionStatus = await response.json();

        if (sessionStatus.mediaItemsSet === true) {
          clearInterval(interval);
          document.getElementById("status").innerText = "Photos sélectionnées. Chargement...";
          listSelectedPhotos();
        }
      }, 3000);
    }

    async function listSelectedPhotos() {
      const response = await fetch(
        `https://photospicker.googleapis.com/v1/mediaItems?sessionId=${currentSessionId}&pageSize=100`,
        {
          headers: {
            "Authorization": "Bearer " + accessToken
          }
        }
      );

      const data = await response.json();

      const container = document.getElementById("photos");
      container.innerHTML = "";

      if (!data.mediaItems || data.mediaItems.length === 0) {
        document.getElementById("status").innerText = "Aucune photo sélectionnée.";
        return;
      }

      data.mediaItems.forEach(item => {
        const img = document.createElement("img");

        // Taille d'affichage optimisée
        img.src = item.mediaFile.baseUrl + "=w600-h600";

        img.alt = item.mediaFile.filename || "Photo Google Photos";

        container.appendChild(img);
      });

      document.getElementById("status").innerText =
        data.mediaItems.length + " photo(s) affichée(s).";
    }
  </script>

</body>
</html>
