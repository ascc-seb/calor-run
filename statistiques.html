<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats Calor Run</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root {
    --primary-color: #215E99;
    --secondary-color: #E61780;
    --bg-white: #fff;
    --bg-light: #f9f9f9;
    --bg-total: #e0e0e0;
    --shadow: rgba(0, 0, 0, 0.15);
    --border-radius: 0.5rem;
    --max-width: 62.5rem;
    --text-dark: #333;
    --text-muted: #777;
    --text-zero: #d8d8d8;
    --border-light: #ddd;
    --header-bg: #e0e0e0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.5;
    color: var(--text-dark);
    min-height: 100vh;
    padding: 1.25rem;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(0.25turn, var(--primary-color), var(--secondary-color));
    opacity: 0.3;
    z-index: -1;
    pointer-events: none;
  }

  .container { max-width: var(--max-width); margin: 0 auto; }

    .header {
      text-align: center;
      margin-bottom: 0.625rem;
      color: var(--primary-color);
      font-size: 1.5rem;
      font-weight: bold;
    }
    .svg-wrapper { position: relative; }
    .header-title {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-shadow: 0 0 6px rgba(255,255,255,0.85), 0 0 3px rgba(255,255,255,0.85);
    }
    .header svg {
      width:100%;
      height:auto;
      max-height:250px;
      display:block;
      margin:0 auto;
    }
    .ecg {
      fill:none;
      stroke:#e61780;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-width:2px;
    }
    .pulse {
      fill:#ffffff;
      filter:url(#glow);
    }
    .halo {
      fill:rgba(255,255,255,.3);
      filter:blur(8px);
    }
    .trail {
      fill:none;
      stroke:#ffffff;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.6;
      filter:blur(4px);
    }
    .coureur { fill:#204b9b; }
    .coeur_gauche { fill:#f0047f; }
    .coeur_droit { fill:url(#radial-gradient); }

  .table-container {
    max-width: var(--max-width);
    overflow-x: auto;
    margin: 0 auto 1.25rem;
    background: var(--bg-white);
    border-radius: var(--border-radius);
    box-shadow: 0 0.25rem 0.75rem var(--shadow);
    padding: 0.5rem;
  }

  .table-title {
    font-weight: bold;
    font-size: 1rem;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  table { width: 100%; border-collapse: collapse; min-width: 43.75rem; }

  th, td {
    padding: 0.25rem;
    border-bottom: 1px solid var(--border-light);
    text-align: left;
    white-space: nowrap;
  }

  th {
    background: var(--header-bg);
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  tbody tr:nth-child(even) { background: var(--bg-light); }

  .muted { color: var(--text-muted); }
  .zero { color: var(--text-zero); }

  tbody tr.row-total {
    font-weight: 700;
    background: var(--bg-total);
  }

  /* Séparateurs verticaux entre groupes de colonnes */
  .col-separator { border-left: 2px solid var(--primary-color); }

  #tbl-cat th, #tbl-cat td { text-align: center; }
  #tbl-cat tbody td:nth-child(2),
  #tbl-cat tbody td:nth-child(5),
  #tbl-cat tbody td:nth-child(8) { border-left: 2px solid #d7d7d7; }

  #tbl-age th:nth-child(1), #tbl-age td:nth-child(1),
  #tbl-age th:nth-child(4), #tbl-age td:nth-child(4),
  #tbl-age th:nth-child(5), #tbl-age td:nth-child(5),
  #tbl-age th:nth-child(8), #tbl-age td:nth-child(8) { text-align: center; }
  #tbl-age th.col-separator, #tbl-age td.col-separator { padding-left: 0.75rem; }
  #tbl-age th:nth-child(4), #tbl-age td:nth-child(4) { border-right: 24px solid var(--bg-white); }

  #tbl-clubs th:nth-child(1), #tbl-clubs td:nth-child(1),
  #tbl-clubs th:nth-child(3), #tbl-clubs td:nth-child(3) { text-align: center; }

  .error {
    display: none;
    color: red;
    text-align: center;
    margin-top: 1rem;
  }

  @media (max-width: 768px) {
    .header { margin-bottom: 0.625rem; font-size: 1rem; }
    table { min-width: auto; font-size: 0.85rem; }
    th, td { padding: 0.375rem 0.5rem; }
    .table-title { flex-direction: column; }
  }
</style>

<script>
(function () {
  'use strict';

  const FIREBASE_CONFIG = {

    measurementId: "G-YVQPW6JGPK"
  };
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();

  // === Firebase Listeners sécurisés ===
  const safeListener = (ref, onData, onError) => {
    if (!ref || typeof ref.on !== 'function') {
      console.error('safeListener: référence Firebase invalide', ref);
      return;
    }
    ref.on('value', snapshot => {
      try { onData(snapshot); } catch (err) { console.error('Erreur Firebase :', err); }
    }, onError);
  };

  // Échappement basique pour éviter toute casse d'affichage si un champ contient < > & " '
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));

  const el = {
    cat: document.querySelector('#tbl-cat tbody'),
    age: document.querySelector('#tbl-age tbody'),
    clubs: document.querySelector('#tbl-clubs tbody'),
    err: document.getElementById('err')
  };

  const ORDER_CAT = ['CA', 'JU', 'ES', 'SE', 'M0', 'M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'M9', 'M10'];

  // --- Helpers communs -----------------------------------------------

  /** Extrait le numéro de course (10 ou 20), que "course" soit un nombre ou un texte ("10 km", "20", ...). */
  function getCourseNumber(p) {
    if (typeof p.course === 'number') return p.course;
    if (typeof p.course === 'string') {
      const m = p.course.match(/(\d{1,3})/);
      return m ? Number(m[1]) : 0;
    }
    return 0;
  }

  function isFemale(p) {
    const g = (p.genre || '').toLowerCase();
    return g === 'f' || g === 'femme';
  }

  /** Parseur de date robuste : ISO (YYYY-MM-DD), européen (DD/MM/YYYY), timestamp, objet Date... */
  function parseDate(d) {
    if (!d && d !== 0) return null;
    if (d instanceof Date) return isNaN(d.getTime()) ? null : d;
    if (typeof d === 'number' && !isNaN(d)) return new Date(d);

    const s = String(d).trim();

    if (/^[0-9]+$/.test(s)) {
      const n = Number(s);
      if (s.length >= 12) return new Date(n); // millisecondes
      const dtSec = new Date(n * 1000); // secondes -> ms
      if (!isNaN(dtSec.getTime())) return dtSec;
    }

    let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); // ISO
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));

    m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/); // DD/MM/YYYY
    if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));

    const dt = new Date(s); // repli natif
    return isNaN(dt.getTime()) ? null : dt;
  }

  function computeAge(birthDate) {
    if (!birthDate || isNaN(birthDate.getTime())) return null;
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const beforeBirthdayThisYear =
      today.getMonth() < birthDate.getMonth() ||
      (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate());
    if (beforeBirthdayThisYear) age--;
    return age;
  }

  const pct = (part, total) => Math.round((100 * part) / (total || 1));
  const fmt = (v) => (v === 0 ? '<span class="zero">0</span>' : v);

  // --- Tableau 1 : répartition par catégories -------------------------
  function renderCats(body, data) {
    const counts = { 10: {}, 20: {} };

    Object.values(data || {}).forEach((p) => {
      const course = getCourseNumber(p);
      const cat = p.categorie || '—';
      counts[course] = counts[course] || {};
      counts[course][cat] = counts[course][cat] || { f: 0, h: 0 };
      isFemale(p) ? counts[course][cat].f++ : counts[course][cat].h++;
    });

    const totaux = { 10: { f: 0, h: 0 }, 20: { f: 0, h: 0 } };

    const rows = ORDER_CAT.map((cat) => {
      const v10 = counts[10][cat] || { f: 0, h: 0 };
      const v20 = counts[20][cat] || { f: 0, h: 0 };

      totaux[10].f += v10.f; totaux[10].h += v10.h;
      totaux[20].f += v20.f; totaux[20].h += v20.h;

      return `
        <tr>
          <td>${cat}</td>
          <td>${fmt(v10.f)}</td>
          <td>${fmt(v10.h)}</td>
          <td>${fmt(v10.f + v10.h)}</td>
          <td>${fmt(v20.f)}</td>
          <td>${fmt(v20.h)}</td>
          <td>${fmt(v20.f + v20.h)}</td>
          <td>${fmt(v10.f + v20.f)}</td>
          <td>${fmt(v10.h + v20.h)}</td>
          <td>${fmt(v10.f + v10.h + v20.f + v20.h)}</td>
        </tr>`;
    });

    const total10 = totaux[10].f + totaux[10].h;
    const total20 = totaux[20].f + totaux[20].h;
    const totalFemmes = totaux[10].f + totaux[20].f;
    const totalHommes = totaux[10].h + totaux[20].h;
    const totalGeneral = totalFemmes + totalHommes;

    rows.push(`
      <tr class="row-total">
        <td>Totaux</td>
        <td>${totaux[10].f} (${pct(totaux[10].f, total10)}%)</td>
        <td>${totaux[10].h} (${pct(totaux[10].h, total10)}%)</td>
        <td>${total10}</td>
        <td>${totaux[20].f} (${pct(totaux[20].f, total20)}%)</td>
        <td>${totaux[20].h} (${pct(totaux[20].h, total20)}%)</td>
        <td>${total20}</td>
        <td>${totalFemmes} (${pct(totalFemmes, totalGeneral)}%)</td>
        <td>${totalHommes} (${pct(totalHommes, totalGeneral)}%)</td>
        <td>${totalGeneral}</td>
      </tr>`);

    body.innerHTML = rows.join('');
  }

  // --- Tableau 2 : plus jeunes / plus âgés par course ------------------
  function renderAges(body, data) {
    const ages = { 10: [], 20: [] };

    Object.entries(data || {}).forEach(([dossard, p]) => {
      const course = getCourseNumber(p);
      if (course !== 10 && course !== 20) return;

      const birth = parseDate(p.naissance);
      const age = computeAge(birth);
      if (age === null) return; // date invalide ou absente

      ages[course].push({ dossard, prenom: p.prenom || '', nom: p.nom || '', age, birth });
    });

    if (!ages[10].length && !ages[20].length) {
      body.innerHTML = '<tr><td colspan="8" class="muted">Aucune donnée d\'âge disponible.</td></tr>';
      return;
    }

    function getOldestYoungest(arr) {
      if (!arr.length) return [null, null];
      const sorted = arr.slice().sort((a, b) => a.birth.getTime() - b.birth.getTime());
      return [sorted[0], sorted[sorted.length - 1]]; // [plus âgé, plus jeune]
    }

    const [oldest10, youngest10] = getOldestYoungest(ages[10]);
    const [oldest20, youngest20] = getOldestYoungest(ages[20]);

    const cell = (p, key) => (p ? p[key] ?? '' : '');

    const rowFor = (p10, p20) => `
      <tr>
        <td>${escapeHtml(cell(p10, 'dossard'))}</td><td>${escapeHtml(cell(p10, 'prenom'))}</td><td>${escapeHtml(cell(p10, 'nom'))}</td><td>${cell(p10, 'age')}</td>
        <td class="col-separator">${escapeHtml(cell(p20, 'dossard'))}</td><td>${escapeHtml(cell(p20, 'prenom'))}</td><td>${escapeHtml(cell(p20, 'nom'))}</td><td>${cell(p20, 'age')}</td>
      </tr>`;

    body.innerHTML = rowFor(oldest10, oldest20) + rowFor(youngest10, youngest20);
  }

  // --- Tableau 3 : classement des clubs --------------------------------
  function renderClubs(body, data) {
    const clubsCount = {};

    Object.values(data || {}).forEach((p) => {
      const club = (p.club || '').trim();
      if (!club) return;
      clubsCount[club] = (clubsCount[club] || 0) + 1;
    });

    const sortedClubs = Object.entries(clubsCount)
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

    body.innerHTML = sortedClubs.length
      ? sortedClubs.map(([club, count], i) => `<tr><td>${i + 1}</td><td>${escapeHtml(club)}</td><td>${count}</td></tr>`).join('')
      : '<tr><td colspan="3" class="muted">Aucune donnée.</td></tr>';
  }

  function showError(msg) {
    el.err.style.display = 'block';
    el.err.textContent = msg;
  }

  // --- Écoute temps réel -----------------------------------------------
  safeListener(db.ref('participants'), (snap) => {
    try {
      const data = snap.val() || {};
      renderCats(el.cat, data);
      renderAges(el.age, data);
      renderClubs(el.clubs, data);
    } catch (e) {
      console.error(e);
      showError('Erreur traitement : ' + e.message);
    }
  }, (err) => {
    console.error(err);
    showError('Erreur Firebase : ' + err.message);
  });
})();
</script>

</body>
</html>
