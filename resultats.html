<style>
:root {
  --primary-color: #215E99;
  --secondary-color: #E61780;
  --bg-white: #fff;
  --bg-light: #f9f9f9;
  --shadow: rgba(0,0,0,0.15);
  --border-radius: 0.5rem;
  --max-width: 62.5rem;
  --text-dark: #333;
  --border-light: #ddd;
  --header-bg: #e0e0e0;
}
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  color: var(--text-dark);
  min-height: 100vh;
  padding: 1.25rem;
  position: relative;
}
body::before {
  content:''; position: fixed; inset:0;
  background: linear-gradient(0.25turn, var(--primary-color), var(--secondary-color));
  opacity:0.3;
  z-index:-1;
  pointer-events: none;
}
.container { max-width: var(--max-width); margin:0 auto; }
.header {
  text-align:center;
  margin-bottom:0.625rem;
  color: var(--primary-color);
  font-size:1.5rem;
  font-weight:bold;
  padding:0;
}
.svg-wrapper {
  position:relative;
}
.header-title {
  position:absolute;
  top:30%;
  left:50%;
  transform:translate(-50%, -50%);
  z-index:2;
  text-shadow: 0 0 6px rgba(255,255,255,0.85), 0 0 3px rgba(255,255,255,0.85);
}
.header svg {
  width:100%;
  height:auto;
  max-height:250px;
  display:block;
  margin:0 auto;
}
    .ecg {
      fill:none;
      stroke:#e61780;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-width:2px;
    }
    .pulse {
      fill:#ffffff;
      filter:url(#glow);
    }
    .halo {
      fill:rgba(255,255,255,.3);
      filter:blur(8px);
    }
    .trail {
      fill:none;
      stroke:#ffffff;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.6;
      filter:blur(4px);
    }
    .coureur { fill:#204b9b; }
    .bras { fill:#FFFFFF; }
    .coeur_gauche { fill:#f0047f; }
    .coeur_droit { fill:url(#radial-gradient); }
.search-counter-container {
  display:flex;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items:center;
  gap:0.625rem;
  margin-bottom:1.25rem;
}
#search {
  flex:1;
  padding:0.5rem 0.75rem;
  border:none;
  border-bottom:1px solid #888;
  background:transparent;
  color: var(--text-dark);
  font-size:1rem;
  outline:none;
  transition:border-color 0.3s;
}
#search:focus { border-bottom-color: var(--primary-color); }
#counter {
  font-weight: normal;
  color: #000;
  margin:0 0.25rem;
  white-space: nowrap;
}
#counter a {
  text-decoration: none;
  font-weight: normal;
  color: #000;
}
#counter a[href*="distance=10"] { color: var(--primary-color); }
#counter a[href*="distance=20"] { color: var(--secondary-color); }
#counter a.active { text-decoration: underline; }
.table-container {
  max-width: var(--max-width);
  overflow-x:auto;
  margin:0 auto 1.25rem;
  background: var(--bg-white);
  border-radius: var(--border-radius);
  box-shadow: 0 0.25rem 0.75rem var(--shadow);
}
table { width:100%; border-collapse: collapse; min-width:43.75rem; }
tr.femme td { color: var(--secondary-color); }
th, td { padding:0.375rem 0.5rem; border-bottom:1px solid var(--border-light); text-align:left; white-space: nowrap; }
th { background: var(--header-bg); font-weight:600; position:sticky; top:0; z-index:10; }
tbody tr:nth-child(even){ background: var(--bg-light); }
.text-center { text-align:center; }
.loading, .no-result { text-align:center; padding:1.25rem 0; font-size:1rem; }
.hidden { display:none; }
@media(max-width:768px){
  .header { margin-bottom:0.625rem; font-size:1rem; }
  .search-counter-container { justify-content:center; flex-direction:column; gap:0.625rem; margin-bottom:0.625rem; }
  #search, #counter { font-size:0.75rem; text-align: center; width: 100%; padding:0rem; max-width: none; flex: none; }
  table { font-size:0.85rem; }
  th, td { padding:0.375rem 0.5rem; }
}
</style>

<script>
'use strict';

const CONFIG = {
    ecg: { speed: 2, trailLength: 25, sampleStep: 1 },
    path: { duration: 3000, pauseBetween: 100, trailLength: 12 }
};

const $ = id => document.getElementById(id);
const setCirclePosition = (circle, point) => {
    circle.setAttribute("cx", point.x);
    circle.setAttribute("cy", point.y);
};
const updateTrail = (trailElement, points, maxLength) => {
    if (points.length > maxLength) points.shift();
    trailElement.setAttribute("points", points.join(" "));
    trailElement.style.opacity = 0.2 + 0.4 * (points.length / maxLength);
};
const samplePolylineUniform = (polyline, step = 1) => {
    const pts = [];
    const len = polyline.getTotalLength();
    for (let l = 0; l <= len; l += step) pts.push(polyline.getPointAtLength(l));
    return pts;
};

// ECG animation
function animateECG() {
    const ecgDot = $("ecgDot"), ecgHalo = $("ecgHalo"), ecgTrail = $("ecgTrail");
    const left = samplePolylineUniform($("ecg_left"), CONFIG.ecg.sampleStep);
    const right = samplePolylineUniform($("ecg_right"), CONFIG.ecg.sampleStep);
    const all = [...left, ...right];
    const trailPts = [];
    let i = 0;

    function frame() {
        const p = all[i];
        setCirclePosition(ecgDot, p);
        setCirclePosition(ecgHalo, p);
        trailPts.push(`${p.x},${p.y}`);
        updateTrail(ecgTrail, trailPts, CONFIG.ecg.trailLength);
        i = (i + 1) % all.length;
        setTimeout(frame, CONFIG.ecg.speed);
    }
    frame();
}

// Path animation
async function animatePath(path, duration = CONFIG.path.duration) {
    const pulse = $("pulse"), halo = $("halo"), trail = $("trail");
    const pts = [];
    const len = path.getTotalLength();
    const start = performance.now();
    return new Promise(resolve => {
        function frame(t) {
            const prog = Math.min((t - start) / duration, 1);
            const p = path.getPointAtLength(prog * len);
            setCirclePosition(pulse, p);
            setCirclePosition(halo, p);
            pts.push(`${p.x},${p.y}`);
            updateTrail(trail, pts, CONFIG.path.trailLength);
            if (prog < 1) requestAnimationFrame(frame);
            else resolve();
        }
        requestAnimationFrame(frame);
    });
}

async function animatePathLoop() {
    const paths = ["coeur_gauche", "coeur_droit", "coureur"].map($);
    const trail = $("trail");
    while (true) {
        for (const p of paths) {
            trail.setAttribute("points", "");
            await animatePath(p);
            await new Promise(r => setTimeout(r, CONFIG.path.pauseBetween));
        }
    }
}

animateECG();
animatePathLoop();
  
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
  authDomain: "calor-run.firebaseapp.com",
  databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calor-run",
  storageBucket: "calor-run.firebasestorage.app",
  messagingSenderId: "329949291334",
  appId: "1:329949291334:web:c71ef20268c609cf953b47",
  measurementId: "G-YVQPW6JGPK"
};
firebase.initializeApp(FIREBASE_CONFIG);

// === Détection distance depuis URL ===
const urlParams = new URLSearchParams(window.location.search);
const distanceParam = urlParams.get('distance');
let COURSE_DISTANCE = null;

if (distanceParam === '10' || distanceParam === '20') {
  COURSE_DISTANCE = parseInt(distanceParam, 10);
  document.title = `Résultats ${COURSE_DISTANCE} km Calor Run`;
  document.getElementById('header-title').textContent = `RÉSULTATS ${COURSE_DISTANCE} KM`;
} else {
  document.title = "Résultats Calor Run";
  document.getElementById('header-title').textContent = "RÉSULTATS CALOR RUN";
}

const db = {
  participants: firebase.database().ref('participants'),
  baseRef: firebase.database().ref('data/base_ref')
};

const el = {
  tbody: document.getElementById('tbody'),
  table: document.getElementById('table-container'),
  search: document.getElementById('search'),
  counter: document.getElementById('counter')
};

let participants = {};
let live_scratch = {};
let searchTerm = '';

// Convertit une valeur Excel (fraction de jour) en "HH:MM:SS"
const formatExcelTime = value => {
  const totalSeconds = Math.round((Number(value) % 1) * 86400);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return [hours, minutes, seconds]
    .map(n => String(n).padStart(2, '0'))
    .join(':');
};

// Échappement basique pour éviter toute casse d'affichage si un champ contient < > & " '
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));

// === Calcul du classement complet (dépend de participants + live_scratch) ===
const computeRanking = () => {
  const data = Object.entries(live_scratch).map(([dossard, value]) => {
    const p = participants[dossard];
    if (!p) return null;
    if (COURSE_DISTANCE && String(p.course) !== String(COURSE_DISTANCE)) return null;
    const temps = Number(value) % 1;
    if (!Number.isFinite(temps)) return null;
    return { ...p, dossard, temps, tempsStr: formatExcelTime(value) };
  }).filter(Boolean);

  data.sort((a, b) => a.temps - b.temps);

  const classementGenre = {};
  const classementCat = {};
  data.forEach((p, i) => {
    p.scratch = i + 1;
    classementGenre[p.genre] = (classementGenre[p.genre] || 0) + 1;
    p.posGenre = classementGenre[p.genre];
    const catKey = `${p.genre}_${p.categorie}`;
    classementCat[catKey] = (classementCat[catKey] || 0) + 1;
    p.posCat = classementCat[catKey];
  });

  return data;
};

// === Rendu du tableau (classement déjà calculé, filtré par recherche) ===
const render = () => {
  const total = COURSE_DISTANCE
    ? Object.values(participants).filter(p => String(p.course) === String(COURSE_DISTANCE)).length
    : Object.values(participants).length;

  const ranking = computeRanking();

  // Compteur
  el.counter.innerHTML = `<a href="?distance=10">10 km</a> • <a href="?distance=20">20 km</a> • Arrivées : ${ranking.length}/${total}`;
  const activeLink = el.counter.querySelector(`a[href="?distance=${COURSE_DISTANCE}"]`);
  if (activeLink && COURSE_DISTANCE) activeLink.classList.add('active');

  // Filtrage par recherche (nom, prénom, catégorie) sans toucher au classement calculé
  const term = searchTerm.trim().toLowerCase();
  const visible = term
    ? ranking.filter(p =>
        (p.nom || '').toLowerCase().includes(term) ||
        (p.prenom || '').toLowerCase().includes(term) ||
        (p.categorie || '').toLowerCase().includes(term))
    : ranking;

  if (visible.length === 0) {
    el.tbody.innerHTML = `<tr><td colspan="9" class="no-result">Aucun résultat</td></tr>`;
    el.table.classList.remove('hidden');
    return;
  }

  const frag = document.createDocumentFragment();
  visible.forEach(p => {
    const tr = document.createElement('tr');
    if (p.genre === 'F') tr.classList.add('femme');
    tr.innerHTML = `
      <td class="text-center">${p.scratch}</td>
      <td class="text-center">${escapeHtml(p.dossard)}</td>
      <td>${escapeHtml(p.nom)}</td>
      <td>${escapeHtml(p.prenom)}</td>
      <td class="text-center">${p.tempsStr}</td>
      <td class="text-center">${escapeHtml(p.genre)}</td>
      <td class="text-center">${p.posGenre}</td>
      <td class="text-center">${escapeHtml(p.categorie)}</td>
      <td class="text-center">${p.posCat}</td>
    `;
    frag.appendChild(tr);
  });

  el.tbody.innerHTML = '';
  el.tbody.appendChild(frag);
  el.table.classList.remove('hidden');
};

// Évite un double rendu si les deux listeners Firebase se déclenchent au même tick
let renderScheduled = false;
const scheduleRender = () => {
  if (renderScheduled) return;
  renderScheduled = true;
  queueMicrotask(() => { renderScheduled = false; render(); });
};

// === Firebase Listeners sécurisés ===
const safeListener = (ref, callback) => {
  ref.on('value', snapshot => {
    try { callback(snapshot); } catch (err) { console.error('Erreur Firebase :', err); }
  });
};

safeListener(db.participants, snap => { participants = snap.val() || {}; scheduleRender(); });

let liveScratchRef = null;

safeListener(db.baseRef, snap => {
  const baseRef = snap.val() || 'live_scratch';
  if (liveScratchRef) { liveScratchRef.off(); }
  liveScratchRef = firebase.database().ref(baseRef);
  safeListener(liveScratchRef, dataSnap => { live_scratch = dataSnap.val() || {}; scheduleRender(); });
  });

// === Recherche ===
el.search.addEventListener('input', e => {
  searchTerm = e.target.value;
  scheduleRender();
});
</script>
