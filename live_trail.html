<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Calor Run</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Particularité de cette page : le .table-container est plus large que le max-width standard */
.table-container { width: 100%; max-width: 1400px; }
.chrono-time {
    position:absolute;
    top:30%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:2;
    font-family: 'Share Tech Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--primary-color);
    text-shadow: 0 0 6px rgba(255,255,255,0.85), 0 0 3px rgba(255,255,255,0.85);
}
.chrono-time.paused { opacity: 0.7; }
.counter-line { text-align: center; margin-bottom: 15px; font-size: 1rem; }
.counter-error {
    animation: blinker 2s linear infinite;
    color: red;
}
@keyframes blinker { 50% { opacity: 0; } }

@media (max-width: 768px) {
    .counter-line { margin-bottom: 5px; font-size:0.75rem; }
    .table-container { width: 100%; overflow-x: auto; }
    table { width: auto; }
    .chrono-time { top:20%; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
      <div class="svg-wrapper">
        <div class="chrono-time paused" id="chrono-time">
            <span id="chrono-text">--:--:--</span>
        </div>
<div id="animSvgContainer"></div>
      </div>
    </div>
    <div id="loading" class="loading"> ⌛ Course en cours ...</div>
        <div id="compteurs" class="counter-line hidden">
        <span class="counter-10km">10 km : 0</span>
        <span>•</span>
        <span class="counter-20km">20 km : 0</span>
        <span> • </span>
        <span class="counter-total">Total : 0</span>
    </div>
</div>
<div class="table-container hidden" id="table-container">
    <table id="classement">
        <thead>
            <tr>
                <th class="text-center">Dossard</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th class="text-center">Temps</th>
                <th class="text-center">Course</th>
                <th class="text-center">Scratch</th>
                <th class="text-center">Genre</th>
                <th class="text-center">Pos. Genre</th>
                <th class="text-center">CAT</th>
                <th class="text-center">Pos. CAT</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="svg-logo.js"></script>
<script src="svg-animation.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
'use strict';

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
    authDomain: "calor-run.firebaseapp.com",
    databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "calor-run",
    storageBucket: "calor-run.firebasestorage.app",
    messagingSenderId: "329949291334",
    appId: "1:329949291334:web:c71ef20268c609cf953b47",
    measurementId: "G-YVQPW6JGPK"
};

const COURSE_ALIASES = {
    '10': '10km', '10km': '10km', '10 km': '10km',
    '20': '20km', '20km': '20km', '20 km': '20km'
};
const normalizeCourse = course => COURSE_ALIASES[String(course).trim()] || course;

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));

const elements = {
    chronoTime: document.getElementById('chrono-time'),
    chronoText: document.getElementById('chrono-text'),
    loading: document.getElementById('loading'),
    compteurs: document.getElementById('compteurs'),
    tbody: document.querySelector('#classement tbody'),
    tableContainer: document.getElementById('table-container'),
    counter10km: null,
    counter20km: null,
    counterTotal: null
};

elements.counter10km = elements.compteurs.querySelector('.counter-10km');
elements.counter20km = elements.compteurs.querySelector('.counter-20km');
elements.counterTotal = elements.compteurs.querySelector('.counter-total');

let departureTimestamp = null;
let participants = {};
let arrivees = {};
let chronoInterval = null;

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
}

function startChrono() {
    clearInterval(chronoInterval);
    // Départ valide seulement s'il est défini, déjà passé, et le même jour
    const now = Date.now();
    const valid = departureTimestamp
        && departureTimestamp <= now
        && new Date(now).toDateString() === new Date(departureTimestamp).toDateString();
    if (!valid) {
        elements.chronoText.textContent = "--:--:--";
        elements.chronoTime.classList.add("paused");
        return;
    }
    elements.chronoTime.classList.remove("paused");
    const update = () => elements.chronoText.textContent = formatTime(Date.now() - departureTimestamp);
    update();
    chronoInterval = setInterval(update, 1000);
}

function createTableRow(participant){
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="text-center">${escapeHtml(participant.dossard)}</td>
        <td>${escapeHtml(participant.nom)}</td>
        <td>${escapeHtml(participant.prenom)}</td>
        <td class="text-center">${participant.tempsStr}</td>
        <td class="text-center">${escapeHtml(participant.course)}</td>
        <td class="text-center">${participant.scratch}</td>
        <td class="text-center">${escapeHtml(participant.genre)}</td>
        <td class="text-center">${participant.posGenre}</td>
        <td class="text-center">${escapeHtml(participant.categorie)}</td>
        <td class="text-center">${participant.posCat}</td>
    `;
    return tr;
}

// Classement affiché du plus lent (en haut) au plus rapide (en bas).
// Les rangs (scratch / genre / catégorie) restent calculés du plus rapide au plus lent :
// on parcourt donc le tableau trié en sens inverse pour incrémenter les compteurs.
function calculatePositions(classement){
    const scratchCounter={}, genreCounter={}, catCounter={};
    let count10=0, count20=0, total10=0, total20=0;

    Object.values(participants).forEach(p=>{
        const courseNormalized = normalizeCourse(p.course);
        if(courseNormalized==='10km') total10++; else if(courseNormalized==='20km') total20++;
    });

    for(let i=classement.length-1;i>=0;i--){
        const p = classement[i];
        const courseNormalized = normalizeCourse(p.course);
        if(courseNormalized==='10km') count10++; else if(courseNormalized==='20km') count20++;

        scratchCounter[courseNormalized] = (scratchCounter[courseNormalized]||0)+1;
        p.scratch = scratchCounter[courseNormalized];

        const genreKey = `${courseNormalized}_${p.genre}`;
        genreCounter[genreKey] = (genreCounter[genreKey]||0)+1;
        p.posGenre = genreCounter[genreKey];

        const catKey = `${courseNormalized}_${p.genre}_${p.categorie}`;
        catCounter[catKey] = (catCounter[catKey]||0)+1;
        p.posCat = catCounter[catKey];
    }
    return {count10,count20,total10,total20};
}

function displayData(classement,count10,count20,total10,total20){
    const fragment = document.createDocumentFragment();
    classement.forEach(p=>fragment.appendChild(createTableRow(p)));
    elements.tbody.innerHTML=''; elements.tbody.appendChild(fragment);
    elements.loading.classList.add('hidden');
    elements.compteurs.classList.remove('hidden');
    elements.tableContainer.classList.remove('hidden');
    elements.counter10km.textContent=`10 km : ${count10}/${total10}`;
    elements.counter20km.textContent=`20 km : ${count20}/${total20}`;
    elements.counterTotal.textContent=`Total : ${classement.length}/${total10+total20}`;
    const displayedTotal = classement.length, expectedTotal=count10+count20;
    if(displayedTotal!==expectedTotal) elements.counterTotal.classList.add('counter-error');
    else elements.counterTotal.classList.remove('counter-error');
}

function updateClassement(){
    if (Object.keys(arrivees).length === 0) {
        elements.tbody.innerHTML = '';
        elements.loading.classList.remove('hidden');
        elements.compteurs.classList.add('hidden');
        elements.tableContainer.classList.add('hidden');
        return;
    }
    const classement = Object.keys(arrivees).map(dossard => {
        const valeurExcel = Number(arrivees[dossard]);
        const fractionJour = valeurExcel %1;
        const tempsMs = Math.round(fractionJour * 86400000);
        const p = participants[String(dossard)] || {};
        return {
            dossard: dossard,
            nom: p.nom || '',
            prenom: p.prenom || '',
            tempsMs: tempsMs,
            tempsStr: formatTime(tempsMs),
            course: p.course || '',
            genre: p.genre || '',
            categorie: p.categorie || ''
        };
    })
    .filter(p => Number.isFinite(p.tempsMs))
    .sort((a, b) => b.tempsMs - a.tempsMs); // plus lent en premier (en haut du tableau)

    const {
        count10,
        count20,
        total10,
        total20
    } = calculatePositions(classement);

    displayData(
        classement,
        count10,
        count20,
        total10,
        total20
    );
}

// Évite plusieurs recalculs si plusieurs refs Firebase changent au même moment
let updateScheduled = false;
function scheduleUpdate(){
    if (updateScheduled) return;
    updateScheduled = true;
    queueMicrotask(() => { updateScheduled = false; updateClassement(); });
}

// === Firebase Listeners sécurisés ===
const safeListener = (ref, onData, onError) => {
    if (!ref || typeof ref.on !== 'function') {
        console.error('safeListener: référence Firebase invalide', ref);
        return;
    }
    ref.on('value', snapshot => {
        try {
            onData(snapshot);
        } catch (err) {
            console.error('Erreur Firebase :', err);
        }
    }, onError);
};

// Chronomètre
safeListener(
    db.ref('data/depart_course'),
    snapshot => {
        departureTimestamp = snapshot.exists()
            ? new Date(snapshot.val()).getTime()
            : null;

        startChrono();
    }
);

// Participants
safeListener(
    db.ref('participants'),
    snapshot => {
        participants = snapshot.val() || {};
        scheduleUpdate();
    }
);

// Résultats dynamiques selon data/base_ref
let arriveesRef = null;

safeListener(
    db.ref('data/base_ref'),
    snapshot => {
        const baseRef = String(
            snapshot.val() || 'live_scratch'
        ).trim();

        // Désabonnement de l'ancienne source
        if (arriveesRef) {
            arriveesRef.off('value');
        }

        // Réinitialise les arrivées lors du changement de source
        arrivees = {};

        // Nouvelle source définie dans data/base_ref
        arriveesRef = db.ref(baseRef);

        safeListener(
            arriveesRef,
            dataSnapshot => {
                arrivees = dataSnapshot.val() || {};
                scheduleUpdate();
            }
        );
    }
);

// Nettoyage à la fermeture de la page
window.addEventListener('beforeunload', () => {
    if (chronoInterval) {
        clearInterval(chronoInterval);
    }

    if (arriveesRef) {
        arriveesRef.off('value');
    }
});
</script>
</body>
</html>
