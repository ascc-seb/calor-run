<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Test Firebase</title>
</head>

<body>

    <h1>Test Firebase</h1>

    <pre id="result">Connexion...</pre>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>

        const config = {
            apiKey: "AIzaSyAIAAz51gEGKQd0EoqA3yUhvnqw3DkQiIo",
            authDomain: "calor-run.firebaseapp.com",
            databaseURL: "https://calor-run-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "calor-run",
            storageBucket: "calor-run.firebasestorage.app",
            messagingSenderId: "329949291334",
            appId: "1:329949291334:web:c71ef20268c609cf953b47"
        };

        firebase.initializeApp(config);

        const db = firebase.database();

        db.ref('live_scratch').once('value')
            .then(snapshot => {

                console.log(snapshot.val());

                document.getElementById('result').textContent =
                    JSON.stringify(
                        snapshot.val(),
                        null,
                        2
                    );

            })
            .catch(error => {

                console.error(error);

                document.getElementById('result').textContent =
                    'ERREUR : ' + error.message;

            });

    </script>

</body>

</html>
